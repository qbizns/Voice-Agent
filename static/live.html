<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Agent - Live Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            padding: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #888;
            font-size: 1.1em;
        }

        .main-area {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .visualizer-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .visualizer-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.6; }
        }

        #waveformCanvas {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            position: relative;
            z-index: 1;
        }

        .start-button {
            background: linear-gradient(135deg, #00d4ff, #7000ff);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
            position: relative;
            z-index: 2;
            margin-top: 20px;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.5);
        }

        .start-button:active {
            transform: translateY(-1px);
        }

        .start-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            font-size: 1.1em;
            color: #00d4ff;
            position: relative;
            z-index: 2;
        }

        .status.error {
            color: #ff4444;
        }

        .status.success {
            color: #00ff88;
        }

        .vad-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            transition: all 0.3s;
        }

        .vad-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
            transition: all 0.3s;
        }

        .vad-dot.speaking {
            background: #00ff88;
            box-shadow: 0 0 20px #00ff88;
            animation: pulse-vad 1s ease-in-out infinite;
        }

        @keyframes pulse-vad {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .vad-text {
            font-size: 0.9em;
            color: #e0e0e0;
        }

        .vad-confidence {
            font-size: 0.85em;
            color: #888;
            margin-left: 10px;
        }

        .transcript-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header .icon {
            font-size: 1.5em;
        }

        .card-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .card-content::-webkit-scrollbar {
            width: 8px;
        }

        .card-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .card-content::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.5);
            border-radius: 10px;
        }

        .transcript-text {
            color: #e0e0e0;
            min-height: 60px;
        }

        .response-text {
            color: #00ff88;
            min-height: 60px;
        }

        .metrics {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            font-size: 0.9em;
            color: #888;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .metric-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .metric-label {
            color: #888;
        }

        .metric-value {
            color: #00d4ff;
            font-weight: 600;
        }

        .log-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #00d4ff;
            padding-left: 10px;
        }

        .log-entry.sent {
            border-left-color: #7000ff;
        }

        .log-entry.received {
            border-left-color: #00ff88;
        }

        .log-entry.error {
            border-left-color: #ff4444;
        }

        .timestamp {
            color: #666;
            font-size: 0.9em;
        }

        .recording-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff4444;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            display: none;
            animation: blink 1.5s infinite;
        }

        .recording-indicator.active {
            display: block;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Voice Selector Styles */
        .voice-selector {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            z-index: 10;
            min-width: 280px;
        }

        .voice-selector-header {
            color: #00d4ff;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .voice-selector-group {
            margin-bottom: 15px;
        }

        .voice-selector-group:last-child {
            margin-bottom: 0;
        }

        .voice-selector-label {
            color: #aaa;
            font-size: 0.9em;
            margin-bottom: 8px;
            display: block;
        }

        .voice-selector select {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .voice-selector select:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.5);
        }

        .voice-selector select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .voice-selector select option {
            background: #1a1f3a;
            color: #e0e0e0;
        }

        .current-voice {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85em;
            color: #888;
        }

        .current-voice span {
            color: #00d4ff;
            font-weight: 500;
        }

        @media (max-width: 1024px) {
            .main-area {
                grid-template-columns: 1fr;
            }

            #waveformCanvas {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ وكيل الصوت التفاعلي</h1>
            <p>تحدث بالعربية واحصل على إجابات فورية من الذكاء الاصطناعي</p>
        </div>

        <div class="main-area">
            <div class="visualizer-section">
                <!-- Voice Selector -->
                <div class="voice-selector">
                    <div class="voice-selector-header">
                        <span>🎭</span>
                        <span>اختيار الصوت</span>
                    </div>
                    <div class="voice-selector-group">
                        <label class="voice-selector-label">اللهجة</label>
                        <select id="dialectSelect">
                            <option value="arabic_egypt">🇪🇬 مصري / Egyptian</option>
                            <option value="arabic_saudi">🇸🇦 سعودي / Saudi</option>
                            <option value="arabic_gulf">🇦🇪 خليجي / Gulf</option>
                            <option value="arabic_levantine">🇯🇴 شامي / Levantine</option>
                            <option value="arabic_maghreb">🇲🇦 مغربي / Maghrebi</option>
                            <option value="arabic_iraq">🇮🇶 عراقي / Iraqi</option>
                            <option value="arabic_yemen">🇾🇪 يمني / Yemeni</option>
                            <option value="arabic_sudan">🇸🇩 سوداني / Sudanese</option>
                            <option value="arabic_tunisia">🇹🇳 تونسي / Tunisian</option>
                            <option value="arabic_algeria">🇩🇿 جزائري / Algerian</option>
                            <option value="arabic_libya">🇱🇾 ليبي / Libyan</option>
                            <option value="arabic_oman">🇴🇲 عماني / Omani</option>
                            <option value="arabic_syria">🇸🇾 سوري / Syrian</option>
                            <option value="arabic_qatar">🇶🇦 قطري / Qatari</option>
                            <option value="arabic_bahrain">🇧🇭 بحريني / Bahraini</option>
                            <option value="arabic_kuwait">🇰🇼 كويتي / Kuwaiti</option>
                        </select>
                    </div>
                    <div class="voice-selector-group">
                        <label class="voice-selector-label">الجنس</label>
                        <select id="genderSelect">
                            <option value="female">أنثى / Female</option>
                            <option value="male">ذكر / Male</option>
                        </select>
                    </div>
                    <div class="current-voice" id="currentVoiceDisplay">
                        الصوت الحالي: <span id="currentVoiceName">تحميل...</span>
                    </div>
                </div>

                <div class="recording-indicator" id="recordingIndicator">● RECORDING</div>
                <div class="vad-indicator" id="vadIndicator" style="display: none;">
                    <div class="vad-dot" id="vadDot"></div>
                    <div class="vad-text" id="vadText">صامت</div>
                    <div class="vad-confidence" id="vadConfidence"></div>
                </div>
                <canvas id="waveformCanvas"></canvas>
                <button id="startButton" class="start-button">🎤 ابدأ المحادثة</button>
                <div id="status" class="status">انقر للبدء</div>
            </div>

            <div class="transcript-section">
                <div class="card">
                    <div class="card-header">
                        <span class="icon">📝</span>
                        <span>النص المكتوب (STT)</span>
                    </div>
                    <div class="card-content">
                        <div id="transcriptText" class="transcript-text">
                            في انتظار الكلام...
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="icon">🤖</span>
                        <span>رد الوكيل الذكي</span>
                    </div>
                    <div class="card-content">
                        <div id="responseText" class="response-text">
                            في انتظار الرد...
                        </div>
                    </div>
                    <div class="metrics" id="metrics" style="display: none;">
                        <div class="metric-item">
                            <span class="metric-label">STT:</span>
                            <span class="metric-value" id="sttTime">-</span>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">AI:</span>
                            <span class="metric-value" id="aiTime">-</span>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">TTS:</span>
                            <span class="metric-value" id="ttsTime">-</span>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">Total:</span>
                            <span class="metric-value" id="totalTime">-</span>
                        </div>
                    </div>
                </div>

                <div class="log-area" id="logArea">
                    <div class="log-entry">Ready to start...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        // Use ws:// for localhost, wss:// for production
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_URL = `${protocol}//${window.location.host}/live`;
        const SAMPLE_RATE = 16000;
        const CHANNELS = 1;
        const CHUNK_DURATION_MS = 400; // 400ms chunks
        const CHUNK_SIZE = Math.floor(SAMPLE_RATE * CHUNK_DURATION_MS / 1000);

        // State
        let ws = null;
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let scriptProcessor = null;
        let isRecording = false;
        let sessionId = null;
        let audioChunks = [];
        let vadEnabled = false;
        let isAIResponding = false;
        let currentAudio = null;

        // Streaming audio state
        let audioQueue = [];
        let isPlayingQueue = false;
        let streamingInProgress = false;

        // DOM Elements
        const startButton = document.getElementById('startButton');
        const statusDiv = document.getElementById('status');
        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');
        const transcriptText = document.getElementById('transcriptText');
        const responseText = document.getElementById('responseText');
        const logArea = document.getElementById('logArea');
        const metricsDiv = document.getElementById('metrics');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const vadIndicator = document.getElementById('vadIndicator');
        const vadDot = document.getElementById('vadDot');
        const vadText = document.getElementById('vadText');
        const vadConfidence = document.getElementById('vadConfidence');
        const dialectSelect = document.getElementById('dialectSelect');
        const genderSelect = document.getElementById('genderSelect');
        const currentVoiceName = document.getElementById('currentVoiceName');

        // Set canvas size
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        // Logging
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('ar-EG');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        // Status updates
        function setStatus(message, type = '') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        // WebSocket connection
        function connectWebSocket() {
            return new Promise((resolve, reject) => {
                log('Connecting to WebSocket: ' + WS_URL, 'info');
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    log('WebSocket connected', 'received');
                    setStatus('متصل ✓', 'success');

                    // Start session
                    sessionId = Math.random().toString(36).substring(7);
                    const startMsg = {
                        type: 'start',
                        data: {
                            language: 'ar',
                            session_id: sessionId,
                            sample_rate: SAMPLE_RATE,
                            channels: CHANNELS,
                            use_vad: true  // Enable VAD for hands-free operation
                        }
                    };
                    ws.send(JSON.stringify(startMsg));
                    log('Session started: ' + sessionId, 'sent');
                    resolve();
                };

                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        handleServerMessage(message);
                    } catch (e) {
                        log('Error parsing message: ' + e.message, 'error');
                    }
                };

                ws.onerror = (error) => {
                    log('WebSocket error: ' + (error.message || 'Connection failed'), 'error');
                    log('Trying to connect to: ' + WS_URL, 'error');
                    setStatus('خطأ في الاتصال', 'error');
                    reject(error);
                };

                ws.onclose = (event) => {
                    log('WebSocket closed. Code: ' + event.code + ', Reason: ' + (event.reason || 'Unknown'), 'error');
                    setStatus('انقطع الاتصال', 'error');
                    stopRecording();
                };
            });
        }

        // Handle server messages
        function handleServerMessage(message) {
            log(`Received: ${message.type}`, 'received');

            switch (message.type) {
                case 'session_started':
                    vadEnabled = message.data.vad_enabled || false;
                    log('Session confirmed: ' + message.data.session_id, 'received');
                    if (vadEnabled) {
                        log('VAD enabled - hands-free mode active', 'success');
                        vadIndicator.style.display = 'flex';
                    }
                    // Update voice display
                    if (message.data.voice) {
                        updateVoiceDisplay(message.data.voice);
                        log(`Voice: ${message.data.voice.display_name}`, 'success');
                    }
                    break;

                case 'voice_updated':
                    if (message.data.voice) {
                        updateVoiceDisplay(message.data.voice);
                        log(`Voice changed to: ${message.data.voice.display_name}`, 'success');
                    }
                    break;

                case 'vad_status':
                    if (vadEnabled) {
                        updateVADIndicator(message.data);

                        // Auto-interrupt if user speaks while AI is responding
                        if (message.data.is_speaking && isAIResponding) {
                            log('User speech detected during AI response - interrupting', 'sent');
                            ws.send(JSON.stringify({ type: 'interrupt' }));
                            stopAudio();
                        }
                    }
                    break;

                case 'interrupted':
                    log('Response interrupted by server', 'received');
                    stopAudio();
                    break;

                case 'transcription':
                    const text = message.data.text;
                    const isFinal = message.data.is_final;
                    transcriptText.textContent = text;
                    if (isFinal) {
                        transcriptText.style.color = '#00ff88';
                        log(`Transcription: "${text}"`, 'received');
                    }
                    break;

                case 'audio_chunk':
                    // Streaming audio chunk received
                    const audioChunk = message.data.audio;
                    const chunkIndex = message.data.chunk_index;
                    const textChunk = message.data.text_chunk;

                    if (!streamingInProgress) {
                        streamingInProgress = true;
                        isAIResponding = true;
                        log('Starting streaming audio playback', 'received');
                    }

                    // Add to queue and start playback
                    audioQueue.push(audioChunk);
                    playAudioQueue();

                    log(`Audio chunk ${chunkIndex} queued (${textChunk.substring(0, 30)}...)`, 'received');
                    break;

                case 'streaming_complete':
                    // Streaming complete
                    streamingInProgress = false;
                    const fullText = message.data.text;
                    responseText.textContent = fullText;

                    // Show metrics
                    if (message.data.processing_times) {
                        metricsDiv.style.display = 'grid';
                        document.getElementById('sttTime').textContent =
                            Math.round(message.data.processing_times.transcription_ms) + 'ms';
                        document.getElementById('aiTime').textContent =
                            Math.round(message.data.processing_times.ai_generation_ms) + 'ms';
                        document.getElementById('ttsTime').textContent = 'streaming';
                        document.getElementById('totalTime').textContent =
                            Math.round(message.data.processing_times.total_ms) + 'ms';
                    }

                    log(`Streaming complete (${message.data.chunks_sent} chunks, ${fullText.length} chars)`, 'received');
                    break;

                case 'response':
                    const response = message.data;
                    responseText.textContent = response.text;

                    // Show metrics
                    if (response.processing_times) {
                        metricsDiv.style.display = 'grid';
                        document.getElementById('sttTime').textContent =
                            Math.round(response.processing_times.transcription_ms) + 'ms';
                        document.getElementById('aiTime').textContent =
                            Math.round(response.processing_times.ai_generation_ms) + 'ms';
                        document.getElementById('ttsTime').textContent =
                            Math.round(response.processing_times.synthesis_ms || 0) + 'ms';
                        document.getElementById('totalTime').textContent =
                            Math.round(response.processing_times.total_ms) + 'ms';
                    }

                    // Play audio
                    if (response.audio) {
                        playAudioResponse(response.audio);
                    }

                    log(`Response received (${response.text.length} chars)`, 'received');
                    if (response.from_cache) {
                        log('✨ Response from cache', 'success');
                    }
                    break;

                case 'error':
                    log('Error: ' + message.data.message, 'error');
                    setStatus('خطأ: ' + message.data.message, 'error');
                    break;
            }
        }

        // Update VAD indicator
        function updateVADIndicator(vadData) {
            const { is_speaking, confidence, silence_duration_ms } = vadData;

            if (is_speaking) {
                vadDot.classList.add('speaking');
                vadText.textContent = '🗣️ يتحدث';
                vadConfidence.textContent = `${Math.round(confidence * 100)}%`;
            } else {
                vadDot.classList.remove('speaking');
                vadText.textContent = '🤫 صامت';
                if (silence_duration_ms > 0) {
                    vadConfidence.textContent = `${Math.round(silence_duration_ms)}ms`;
                } else {
                    vadConfidence.textContent = '';
                }
            }
        }

        // Stop current audio playback
        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            // Clear audio queue
            audioQueue = [];
            isPlayingQueue = false;
            streamingInProgress = false;
            isAIResponding = false;
            log('Audio playback stopped', 'info');
        }

        // Update voice display
        function updateVoiceDisplay(voiceInfo) {
            const { dialect, gender, display_name, voice_id } = voiceInfo;

            // Update current voice display
            currentVoiceName.textContent = `${display_name} (${voice_id})`;

            // Update selects to match current voice (without triggering change event)
            dialectSelect.value = dialect;
            genderSelect.value = gender;

            log(`Voice display updated: ${display_name}`, 'info');
        }

        // Send voice update to server
        function sendVoiceUpdate() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('WebSocket not connected - cannot update voice', 'error');
                return;
            }

            const dialect = dialectSelect.value;
            const gender = genderSelect.value;

            ws.send(JSON.stringify({
                type: 'update_voice',
                data: {
                    dialect: dialect,
                    gender: gender
                }
            }));

            log(`Updating voice: ${dialect} (${gender})`, 'sent');
        }

        // Voice selector event listeners
        dialectSelect.addEventListener('change', sendVoiceUpdate);
        genderSelect.addEventListener('change', sendVoiceUpdate);

        // Play queued audio chunks in sequence
        async function playAudioQueue() {
            // If already playing, let it continue
            if (isPlayingQueue) {
                return;
            }

            // Start processing queue
            isPlayingQueue = true;

            while (audioQueue.length > 0) {
                // Check if interrupted
                if (!isAIResponding) {
                    audioQueue = [];
                    break;
                }

                // Get next chunk
                const base64Audio = audioQueue.shift();

                try {
                    // Decode and play chunk
                    const binaryString = atob(base64Audio);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }

                    const blob = new Blob([bytes], { type: 'audio/mpeg' });
                    const url = URL.createObjectURL(blob);
                    const audio = new Audio(url);
                    currentAudio = audio;

                    // Wait for this chunk to finish playing
                    await new Promise((resolve, reject) => {
                        audio.onended = () => {
                            URL.revokeObjectURL(url);
                            currentAudio = null;
                            resolve();
                        };

                        audio.onerror = (e) => {
                            URL.revokeObjectURL(url);
                            currentAudio = null;
                            log('Audio chunk playback error', 'error');
                            reject(e);
                        };

                        audio.play().catch(reject);
                    });

                } catch (e) {
                    log('Error playing audio chunk: ' + e.message, 'error');
                }
            }

            // Queue is empty
            isPlayingQueue = false;

            // If streaming is complete and queue is empty, mark as not responding
            if (!streamingInProgress && audioQueue.length === 0) {
                isAIResponding = false;
                currentAudio = null;
                log('All audio chunks played', 'info');
            }
        }

        // Play audio response
        async function playAudioResponse(base64Audio) {
            try {
                // Stop any currently playing audio
                stopAudio();

                log('Playing audio response...', 'info');
                isAIResponding = true;

                // Decode base64
                const binaryString = atob(base64Audio);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                // Create audio element
                const blob = new Blob([bytes], { type: 'audio/mpeg' });
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                currentAudio = audio;

                audio.onended = () => {
                    URL.revokeObjectURL(url);
                    isAIResponding = false;
                    currentAudio = null;
                    log('Audio playback finished', 'info');
                };

                audio.onerror = () => {
                    URL.revokeObjectURL(url);
                    isAIResponding = false;
                    currentAudio = null;
                    log('Audio playback error', 'error');
                };

                await audio.play();
            } catch (e) {
                isAIResponding = false;
                currentAudio = null;
                log('Error playing audio: ' + e.message, 'error');
            }
        }

        // Start recording
        async function startRecording() {
            try {
                setStatus('جاري طلب الإذن...', '');
                log('Requesting microphone access...', 'info');

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: SAMPLE_RATE,
                        channelCount: CHANNELS,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                log('Microphone access granted', 'received');

                // Create audio context
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: SAMPLE_RATE
                });

                // Create analyser for visualization
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;

                // Create microphone source
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);

                // Create script processor for audio chunks
                const bufferSize = 4096;
                scriptProcessor = audioContext.createScriptProcessor(bufferSize, CHANNELS, CHANNELS);

                let buffer = [];
                scriptProcessor.onaudioprocess = (e) => {
                    if (!isRecording) return;

                    const inputData = e.inputBuffer.getChannelData(0);

                    // Convert float32 to int16
                    const int16Data = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        const s = Math.max(-1, Math.min(1, inputData[i]));
                        int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }

                    buffer.push(...int16Data);

                    // Send chunk when buffer reaches chunk size
                    if (buffer.length >= CHUNK_SIZE) {
                        const chunk = buffer.slice(0, CHUNK_SIZE);
                        buffer = buffer.slice(CHUNK_SIZE);
                        sendAudioChunk(chunk);
                    }
                };

                microphone.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);

                // Connect WebSocket
                await connectWebSocket();

                // Start recording
                isRecording = true;
                recordingIndicator.classList.add('active');
                startButton.textContent = '⏹️ إيقاف';
                setStatus('🎙️ جارٍ التسجيل...', 'success');
                log('Recording started', 'sent');

                // Start visualization
                visualize();

            } catch (e) {
                log('Error starting recording: ' + e.message, 'error');
                setStatus('فشل الوصول للميكروفون', 'error');
                console.error(e);
            }
        }

        // Stop recording
        function stopRecording() {
            if (!isRecording) return;

            isRecording = false;
            recordingIndicator.classList.remove('active');

            // Send end signal
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'end' }));
                log('End signal sent', 'sent');
            }

            // Cleanup
            if (scriptProcessor) {
                scriptProcessor.disconnect();
                scriptProcessor = null;
            }

            if (microphone) {
                microphone.disconnect();
                microphone = null;
            }

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            if (ws) {
                ws.close();
                ws = null;
            }

            startButton.textContent = '🎤 ابدأ المحادثة';
            setStatus('تم الإيقاف', '');
            log('Recording stopped', 'info');
        }

        // Send audio chunk
        function sendAudioChunk(int16Array) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            if (!int16Array || int16Array.length === 0) return;

            try {
                // Convert int16 to base64 (handle large arrays properly)
                const bytes = new Uint8Array(int16Array.buffer);
                
                // Use binary string method for large arrays
                let binary = '';
                const chunkSize = 8192;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    const chunk = bytes.subarray(i, i + chunkSize);
                    binary += String.fromCharCode.apply(null, chunk);
                }
                const base64 = btoa(binary);

                if (!base64 || base64.length === 0) {
                    log('Warning: Empty base64 encoding', 'error');
                    return;
                }

                const message = {
                    type: 'audio_chunk',
                    data: {
                        sample_rate: SAMPLE_RATE,
                        channels: CHANNELS,
                        pcm16: base64
                    }
                };

                ws.send(JSON.stringify(message));
            } catch (e) {
                log('Error sending audio chunk: ' + e.message, 'error');
            }
        }

        // Visualize audio waveform
        function visualize() {
            if (!isRecording || !analyser) return;

            requestAnimationFrame(visualize);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteTimeDomainData(dataArray);

            // Clear canvas
            ctx.fillStyle = 'rgba(10, 14, 39, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw circular waveform
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.7;

            ctx.lineWidth = 3;
            ctx.strokeStyle = '#00d4ff';
            ctx.beginPath();

            for (let i = 0; i < bufferLength; i++) {
                const angle = (i / bufferLength) * Math.PI * 2;
                const amplitude = (dataArray[i] - 128) / 128;
                const r = radius + amplitude * 50;

                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.closePath();
            ctx.stroke();

            // Draw center circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#00d4ff';
            ctx.fill();
        }

        // Start button handler
        startButton.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        // Initial message
        log('Page loaded. Click "ابدأ المحادثة" to start.', 'info');
    </script>
</body>
